name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

# Serialize release runs (never cancel an in-flight publish). Dispatches for
# the same tag queue instead of racing the existence check against creation.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: 'Verify Release Tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verify Tag Alignment
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_NAME" != "v$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG_NAME' does not match manifest version 'v$PKG_VERSION'"
            exit 1
          fi

  # Shared merge gate (same definition PRs run). Ref semantics are deliberate:
  # `uses:` resolves the called workflow definition from the caller's commit —
  # the tag commit on tag push, the dispatched branch on workflow_dispatch —
  # while `with.ref` pins the checked-out source to the tag. GitHub Actions
  # does not allow dynamic refs in `uses:`, so dispatch always validates the
  # tag with the dispatched branch's check definition.
  ci:
    name: 'CI'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  publish:
    name: 'Publish GitHub Release'
    needs: [verify-tag, ci]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Check for Existing Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag }}
        run: |
          response="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" 2>&1)" && {
            echo "::error::A release for tag '$TAG_NAME' already exists. Publish is not idempotent by design — delete the existing release first if you intend to republish, or dispatch a different tag."
            exit 1
          }
          case "$response" in
            *"Not Found"*) ;;
            *)
              echo "::error::Unable to verify whether a release exists for tag '$TAG_NAME'."
              echo "$response" >&2
              exit 1
              ;;
          esac

      - name: Generate Release Notes
        id: notes
        run: |
          node scripts/bump-version.mjs notes --notes-file RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
