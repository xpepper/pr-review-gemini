name: 'Gem PR Review'

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Code Review
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, '/gem-review') || contains(github.event.comment.body, '/gem-pr-review'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve trusted base branch
        id: base
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            if (context.eventName === 'pull_request') {
              return context.payload.pull_request.base.sha;
            }
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            return pull.base.sha;

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base.outputs.result }}

      - name: Detect trusted-base Action contract
        id: action-contract
        shell: bash
        run: |
          if [ ! -f action.yml ]; then
            echo "::error title=Gem PR Review::Trusted-base action.yml is unavailable."
            exit 1
          fi
          if [ -f .github/gem-pr-review-action-bootstrap-v1 ]; then
            echo "legacy_bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            echo "legacy_bootstrap=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require legacy Copilot authentication
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error title=Gem PR Review::Copilot authentication is unavailable; fork pull requests fail closed."
            exit 1
          fi

      - name: Set up Node.js for legacy base Action
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI for legacy base Action
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        run: npm install --global @github/copilot@1.0.83

      - name: Run legacy base Gem PR Review
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        uses: ./
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: balanced
          fail_on: P1
          incremental: auto
          action: publish

      - name: Run Gem PR Review
        if: steps.action-contract.outputs.legacy_bootstrap == 'false'
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          copilot_token: ${{ secrets.COPILOT_TOKEN }}
          mode: balanced
          fail_on: P1
          incremental: auto
          action: publish
