name: 'Gem PR Review'

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Code Review
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, '/gem-review') || contains(github.event.comment.body, '/gem-pr-review'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve trusted base branch
        id: base
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            if (context.eventName === 'pull_request') {
              return context.payload.pull_request.base.sha;
            }
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            return pull.base.sha;

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base.outputs.result }}

      - name: Resolve trusted Action contract detector
        id: action-contract-detector-source
        shell: bash
        run: |
          set -euo pipefail
          detector_path="scripts/detect-action-contract.rb"
          detector_sha256=6b6616a29cd927fc7f2ada24db82bec0a42edd938842a0bc31c7f6251a814f71
          if [ -f "$detector_path" ] && [ ! -L "$detector_path" ]; then
            actual_sha256="$(shasum -a 256 "$detector_path" | awk '{print $1}')"
            if [ "$actual_sha256" = "$detector_sha256" ]; then
              echo "source=base" >> "$GITHUB_OUTPUT"
              echo "sha256=$detector_sha256" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "source=artifact" >> "$GITHUB_OUTPUT"
          echo "sha256=$detector_sha256" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable Action contract detector
        if: steps.action-contract-detector-source.outputs.source == 'artifact'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: xpepper/pr-review-gemini
          ref: d8b3ae8f104e4e7a95ca129072c04148f3f5ddb2
          path: .gem-pr-review-action-contract-detector
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/detect-action-contract.rb
          sparse-checkout-cone-mode: false

      - name: Detect trusted-base Action contract
        id: action-contract
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f action.yml ]; then
            echo "::error title=Gem PR Review::Trusted-base action.yml is unavailable."
            exit 1
          fi
          case "${{ steps.action-contract-detector-source.outputs.source }}" in
            base)
              detector_path="scripts/detect-action-contract.rb"
              ;;
            artifact)
              detector_path=".gem-pr-review-action-contract-detector/scripts/detect-action-contract.rb"
              ;;
            *)
              echo "::error title=Gem PR Review::Trusted Action contract detector source is invalid."
              exit 1
              ;;
          esac
          if [ ! -f "$detector_path" ] || [ -L "$detector_path" ]; then
            echo "::error title=Gem PR Review::Trusted Action contract detector is unavailable."
            exit 1
          fi
          actual_sha256="$(shasum -a 256 "$detector_path" | awk '{print $1}')"
          expected_sha256="${{ steps.action-contract-detector-source.outputs.sha256 }}"
          if [ -z "$expected_sha256" ] || [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error title=Gem PR Review::Trusted Action contract detector integrity check failed."
            exit 1
          fi
          if ! contract=$(ruby "$detector_path" action.yml); then
            echo "::error title=Gem PR Review::Trusted-base action contract is unsupported."
            exit 1
          fi
          case "$contract" in
            modern)
              echo "legacy_bootstrap=false" >> "$GITHUB_OUTPUT"
              ;;
            legacy)
              echo "legacy_bootstrap=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=Gem PR Review::Trusted-base action contract is invalid."
              exit 1
              ;;
          esac

      - name: Require legacy Copilot authentication
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error title=Gem PR Review::Copilot authentication is unavailable; fork pull requests fail closed."
            exit 1
          fi

      - name: Set up Node.js for legacy base Action
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI for legacy base Action
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        run: npm install --global @github/copilot@1.0.83

      - name: Run legacy base Gem PR Review
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        uses: ./
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: balanced
          fail_on: P1
          incremental: auto
          action: publish

      - name: Run Gem PR Review
        if: steps.action-contract.outputs.legacy_bootstrap == 'false'
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          copilot_token: ${{ secrets.COPILOT_TOKEN }}
          mode: balanced
          fail_on: P1
          incremental: auto
          action: publish
