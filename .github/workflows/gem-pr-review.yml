name: 'Gem PR Review'

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Code Review
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, '/gem-review') || contains(github.event.comment.body, '/gem-pr-review'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve trusted base branch
        id: base
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            if (context.eventName === 'pull_request') {
              return context.payload.pull_request.base.sha;
            }
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            return pull.base.sha;

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base.outputs.result }}

      - name: Detect trusted-base Action contract
        id: action-contract
        shell: bash
        run: |
          if [ ! -f action.yml ]; then
            echo "::error title=Gem PR Review::Trusted-base action.yml is unavailable."
            exit 1
          fi
          if git cat-file -e HEAD:scripts/detect-action-contract.rb 2>/dev/null; then
            # Load the detector from the same trusted base commit as action.yml.
            if ! contract=$(git show HEAD:scripts/detect-action-contract.rb | ruby - action.yml); then
              echo "::error title=Gem PR Review::Trusted-base action.yml could not be parsed."
              exit 1
            fi
          else
            # Older trusted bases predate the detector; validate only their legacy contract inline.
            if ! contract=$(ruby - action.yml <<'RUBY'
          require 'yaml'

          manifest = YAML.safe_load(
            File.read(ARGV.fetch(0)),
            permitted_classes: [],
            permitted_symbols: [],
            aliases: false
          )
          abort 'action.yml must contain a mapping' unless manifest.is_a?(Hash)
          inputs = manifest.fetch('inputs', {})
          runs = manifest['runs']
          abort 'action.yml inputs must be a mapping' unless inputs.is_a?(Hash)
          abort 'action.yml runs must be a mapping' unless runs.is_a?(Hash)
          steps = runs['steps']
          abort 'action.yml steps must be a list of mappings' unless steps.is_a?(Array) && steps.all? { |step| step.is_a?(Hash) }

          def blank_setup_env?(step)
            env = step['env']
            env.is_a?(Hash) &&
              env['COPILOT_GITHUB_TOKEN'] == '' &&
              env['GH_TOKEN'] == '' &&
              env['GITHUB_TOKEN'] == ''
          end

          auth_step = steps.find { |step| step['name'] == 'Require Copilot authentication' }
          node_step = steps.find { |step| step['name'] == 'Set up Node.js for Copilot CLI' }
          install_step = steps.find { |step| step['name'] == 'Install GitHub Copilot CLI' }
          review_step = steps.find { |step| step['name'] == 'Run Gem PR Review' }
          auth_run = auth_step.fetch('run', '').to_s if auth_step
          install_run = install_step.fetch('run', '').to_s if install_step
          expression_start = '$' + '{{ '
          copilot_token_expression = expression_start + 'inputs.copilot_token }}'
          github_token_expression = expression_start + 'inputs.github_token }}'
          modern =
            runs['using'] == 'composite' &&
            inputs['copilot_token'].is_a?(Hash) &&
            inputs['copilot_token']['required'] == true &&
            auth_step &&
            auth_step.dig('env', 'COPILOT_GITHUB_TOKEN') == copilot_token_expression &&
            auth_run.include?('if [ -z "$COPILOT_GITHUB_TOKEN" ]') &&
            auth_run.include?('exit 1') &&
            node_step &&
            node_step['uses'] == 'actions/setup-node@v6' &&
            node_step.dig('with', 'node-version').to_s == '22' &&
            blank_setup_env?(node_step) &&
            install_step &&
            blank_setup_env?(install_step) &&
            install_run.include?('npm ci --prefix') &&
            install_run.include?('--ignore-scripts') &&
            review_step &&
            review_step.dig('env', 'COPILOT_GITHUB_TOKEN') == copilot_token_expression
          legacy =
            runs['using'] == 'composite' &&
            !inputs.key?('copilot_token') &&
            steps.length == 1 &&
            review_step &&
            review_step['id'] == 'review' &&
            review_step['shell'] == 'bash' &&
            review_step.fetch('run', '').to_s.include?('scripts/ci-action.mjs') &&
            review_step.dig('env', 'GITHUB_TOKEN') == github_token_expression &&
            review_step.dig('env', 'GH_TOKEN') == github_token_expression
          if modern
            puts 'modern'
          elsif legacy
            puts 'legacy'
          else
            abort 'action.yml has an unsupported contract'
          end
          RUBY
            ); then
              echo "::error title=Gem PR Review::Trusted-base action contract is unsupported."
              exit 1
            fi
          fi
          case "$contract" in
            modern)
              echo "legacy_bootstrap=false" >> "$GITHUB_OUTPUT"
              ;;
            legacy)
              echo "legacy_bootstrap=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=Gem PR Review::Trusted-base action contract is invalid."
              exit 1
              ;;
          esac

      - name: Require legacy Copilot authentication
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error title=Gem PR Review::Copilot authentication is unavailable; fork pull requests fail closed."
            exit 1
          fi

      - name: Set up Node.js for legacy base Action
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI for legacy base Action
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        run: npm install --global @github/copilot@1.0.83

      - name: Run legacy base Gem PR Review
        if: steps.action-contract.outputs.legacy_bootstrap == 'true'
        uses: ./
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: balanced
          fail_on: P1
          incremental: auto
          action: publish

      - name: Run Gem PR Review
        if: steps.action-contract.outputs.legacy_bootstrap == 'false'
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          copilot_token: ${{ secrets.COPILOT_TOKEN }}
          mode: balanced
          fail_on: P1
          incremental: auto
          action: publish
