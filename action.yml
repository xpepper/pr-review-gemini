name: 'Gem PR Review'
description: 'Automated multi-lens AI code review for GitHub pull requests with host-gated safety and quality gates'
author: 'Pietro Di Bello'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  github_token:
    description: 'GitHub token for authenticating API requests and posting reviews'
    required: false
    default: '${{ github.token }}'
  copilot_token:
    description: 'User-owned fine-grained PAT with the Copilot Requests account permission'
    required: true
  pr_number:
    description: 'Pull request number to review (auto-detected from GITHUB_EVENT_PATH if omitted)'
    required: false
  mode:
    description: 'Review mode: balanced (default), quick, full, or deep'
    required: false
    default: 'balanced'
  fail_on:
    description: 'Severity threshold that triggers job failure (P0, P1, P2, P3, or none)'
    required: false
    default: 'none'
  incremental:
    description: "Whether to run an incremental re-review (auto, true, or false). In 'auto' mode, synchronize events automatically trigger incremental reviews."
    required: false
    default: 'auto'
  action:
    description: 'Review action: publish (default, post review to PR) or dry-run (generate summary only)'
    required: false
    default: 'publish'
  select:
    description: "Finding filter or selection specification (e.g. 'p0,p1', 'min:p2', '1,3')"
    required: false
  guidelines_path:
    description: 'Custom path to repository review guidelines file (defaults to .github/gem-pr-review.md)'
    required: false
  verbose:
    description: 'Enable verbose diagnostic execution telemetry'
    required: false
    default: 'false'

outputs:
  verdict:
    description: 'Overall review verdict (PASS or FAIL)'
    value: ${{ steps.review.outputs.verdict }}
  findings_count:
    description: 'Total number of findings detected across all review lenses'
    value: ${{ steps.review.outputs.findings_count }}
  blocking_count:
    description: 'Number of blocking findings that met or exceeded the fail_on threshold'
    value: ${{ steps.review.outputs.blocking_count }}
  verification_status:
    description: 'Detached worktree verification status (passed, failed, or none)'
    value: ${{ steps.review.outputs.verification_status }}
  documentation_consistency_status:
    description: 'Documentation consistency status (passed, failed, skipped, not_applicable, or not_run)'
    value: ${{ steps.review.outputs.documentation_consistency_status }}
  summary:
    description: 'Markdown review summary'
    value: ${{ steps.review.outputs.summary }}
  diagnostics:
    description: 'Structured, sanitized execution telemetry JSON'
    value: ${{ steps.review.outputs.diagnostics }}

runs:
  using: 'composite'
  steps:
    - name: Require Copilot authentication
      shell: bash
      env:
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot_token }}
      run: |
        if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
          echo "::error title=Gem PR Review::Copilot authentication is unavailable; fork pull requests fail closed."
          exit 1
        fi

    - name: Resolve Action path for dependency cache
      id: action_path
      shell: bash
      run: |
        set -euo pipefail
        source_path="${{ github.action_path }}"
        if [ -z "$source_path" ] || [ ! -d "$source_path" ]; then
          echo "::error title=Gem PR Review::Action path is unavailable."
          exit 1
        fi
        action_path="$(cd "$source_path" && pwd -P)"
        echo "root=$action_path" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js for Copilot CLI
      uses: actions/setup-node@v6
      env:
        COPILOT_GITHUB_TOKEN: ''
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ steps.action_path.outputs.root }}/.github/copilot-cli/package-lock.json

    - name: Clean stale GitHub Copilot CLI installs
      shell: bash
      env:
        COPILOT_GITHUB_TOKEN: ''
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      run: |
        set -euo pipefail
        bash "${{ steps.action_path.outputs.root }}/scripts/cleanup-copilot-install.sh" prune-stale

    - name: Install GitHub Copilot CLI
      id: install_copilot
      shell: bash
      env:
        COPILOT_GITHUB_TOKEN: ''
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      run: |
        set -euo pipefail
        install_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/gem-pr-review-copilot.XXXXXX")"
        created_at="$(date +%s)"
        if ! bash "${{ steps.action_path.outputs.root }}/scripts/cleanup-copilot-install.sh" initialize-install "$install_root" "$created_at"; then
          rm -rf -- "$install_root"
          exit 1
        fi
        echo "install_root=$install_root" >> "$GITHUB_OUTPUT"
        cp "${{ github.action_path }}/.github/copilot-cli/package.json" "$install_root/package.json"
        cp "${{ github.action_path }}/.github/copilot-cli/package-lock.json" "$install_root/package-lock.json"
        npm ci --prefix "$install_root" --ignore-scripts --omit=dev --no-audit --no-fund
        echo "$install_root/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run Gem PR Review
      id: review
      shell: bash
      env:
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot_token }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
        INPUT_INCREMENTAL: ${{ inputs.incremental }}
        INPUT_ACTION: ${{ inputs.action }}
        INPUT_SELECT: ${{ inputs.select }}
        INPUT_GUIDELINES_PATH: ${{ inputs.guidelines_path }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        COPILOT_INSTALL_ROOT: ${{ steps.install_copilot.outputs.install_root }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        bash "${{ steps.action_path.outputs.root }}/scripts/cleanup-copilot-install.sh" activate-lease "$COPILOT_INSTALL_ROOT"
        node "${{ github.action_path }}/scripts/ci-action.mjs"

    - name: Clean up GitHub Copilot CLI
      if: ${{ always() && steps.install_copilot.outcome != 'skipped' }}
      shell: bash
      env:
        COPILOT_INSTALL_ROOT: ${{ steps.install_copilot.outputs.install_root }}
      run: |
        set -euo pipefail
        bash "${{ steps.action_path.outputs.root }}/scripts/cleanup-copilot-install.sh" cleanup-current
